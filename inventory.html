<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econment - Αποθήκη</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6">
        <div class="mb-6 bg-white p-6 rounded-lg shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Econment - Κεντρική Αποθήκη</h1>
                <nav class="flex space-x-4 mt-3">
                    <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium">👥 Πελατολόγιο</a>
                    <a href="inventory.html" class="text-sm text-blue-600 border-b-2 border-blue-600 pb-1 font-bold">📦 Αποθήκη (Στοκ)</a>
                    <a href="orders.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium">🚚 Διανομές / Παραγγελίες</a>
                </nav>
            </div>
            <button onclick="toggleModal(true)" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium">+ Νέο Προϊόν</button>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Κωδικός</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Προϊόν</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Απόθεμα</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Ενέργειες</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <div id="productModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4">
                <h3 class="text-lg font-bold text-gray-800">Νέο Προϊόν Αποθήκης</h3>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Κωδικός *</label>
                    <input type="text" id="prodSku" required class="w-full px-3 py-2 border rounded-lg text-sm font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Όνομα Προϊόντος *</label>
                    <input type="text" id="prodName" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Ποσότητα Στοκ *</label>
                    <input type="number" id="prodQty" required min="0" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="pt-4 border-t flex justify-end space-x-2">
                    <button type="button" onclick="toggleModal(false)" class="bg-gray-200 px-4 py-2 rounded-lg text-sm">Ακύρωση</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm shadow">Αποθήκευση</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let products = [];
        function loadInventory() {
            products = JSON.parse(localStorage.getItem('econment_products') || '[]');
            renderInventory();
        }
        function toggleModal(show) {
            document.getElementById('productModal').classList.toggle('hidden', !show);
            if(!show) document.getElementById('productForm').reset();
        }
        function saveProduct(event) {
            event.preventDefault();
            products.push({
                sku: document.getElementById('prodSku').value.toUpperCase(),
                name: document.getElementById('prodName').value,
                qty: parseInt(document.getElementById('prodQty').value),
                freezer: false, minQty: 1
            });
            localStorage.setItem('econment_products', JSON.stringify(products));
            renderInventory();
            toggleModal(false);
        }
        function deleteProduct(index) {
            if (confirm("Διαγραφή προϊόντος;")) {
                products.splice(index, 1);
                localStorage.setItem('econment_products', JSON.stringify(products));
                renderInventory();
            }
        }
        function renderInventory() {
            const tbody = document.getElementById('inventoryBody'); tbody.innerHTML = '';
            products.forEach((prod, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm font-mono">${prod.sku}</td>
                        <td class="px-6 py-4 text-sm font-bold text-gray-900">${prod.name}</td>
                        <td class="px-6 py-4 text-sm font-semibold">${prod.qty}</td>
                        <td class="px-6 py-4 text-right text-sm">
                            <button onclick="deleteProduct(${index})" class="text-red-600 bg-red-50 px-2 py-1 rounded">🗑️</button>
                        </td>
                    </tr>`;
            });
        }
        window.onload = loadInventory;
    </script>
</body>
</html>
