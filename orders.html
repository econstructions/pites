<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econment - Διανομές</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6">
        <div class="mb-6 bg-white p-6 rounded-lg shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Econment - Κίνηση Διανομών</h1>
                <nav class="flex space-x-4 mt-3">
                    <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium">👥 Πελατολόγιο</a>
                    <a href="inventory.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium">📦 Αποθήκη (Στοκ)</a>
                    <a href="orders.html" class="text-sm text-blue-600 border-b-2 border-blue-600 pb-1 font-bold">🚚 Διανομές / Παραγγελίες</a>
                </nav>
            </div>
            <button onclick="toggleModal(true)" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm font-medium">+ Νέα Παραγγελία</button>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID / Ημ/νία</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Πελάτης</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Προϊόν (Ποσότητα)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Κατάσταση</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Ενέργειες</th>
                    </tr>
                </thead>
                <tbody id="ordersBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div id="orderModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <form id="orderForm" onsubmit="saveOrder(event)" class="space-y-4">
                <h3 class="text-lg font-bold text-gray-800">Έκδοση Δελτίου Παραγγελίας</h3>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Επιλογή Πελάτη *</label>
                    <select id="orderClient" required class="w-full px-3 py-2 border rounded-lg text-sm bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Προϊόν *</label>
                    <select id="orderProduct" required class="w-full px-3 py-2 border rounded-lg text-sm bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Ποσότητα *</label>
                    <input type="number" id="orderQty" required min="1" value="1" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="pt-4 border-t flex justify-end space-x-2">
                    <button type="button" onclick="toggleModal(false)" class="bg-gray-200 px-4 py-2 rounded-lg text-sm">Ακύρωση</button>
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm shadow">Έκδοση</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let orders = [];
        
        function loadOrders() {
            orders = JSON.parse(localStorage.getItem('econment_orders') || '[]');
            renderOrders();
        }
        
        function populateDropdowns() {
            const clientSelect = document.getElementById('orderClient');
            const productSelect = document.getElementById('orderProduct');
            const liveClients = JSON.parse(localStorage.getItem('econment_clients') || '[]');
            const liveProducts = JSON.parse(localStorage.getItem('econment_products') || '[]');

            clientSelect.innerHTML = liveClients.length === 0 ? '<option value="">⚠️ Προσθέστε πελάτες στο Πελατολόγιο</option>' : '';
            liveClients.forEach(c => { clientSelect.innerHTML += `<option value="${c.companyName} (${c.city})">${c.companyName} (${c.city})</option>`; });

            productSelect.innerHTML = liveProducts.length === 0 ? '<option value="">⚠️ Προσθέστε προϊόντα στην Αποθήκη</option>' : '';
            liveProducts.forEach(p => { productSelect.innerHTML += `<option value="${p.name}">${p.name} (Διαθέσιμο: ${p.qty})</option>`; });
        }
        
        function toggleModal(show) {
            if (show) populateDropdowns();
            document.getElementById('orderModal').classList.toggle('hidden', !show);
            if(!show) document.getElementById('orderForm').reset();
        }
        
        function saveOrder(event) {
            event.preventDefault();
            const clientFull = document.getElementById('orderClient').value;
            const prodVal = document.getElementById('orderProduct').value;
            if(!clientFull || !prodVal) { alert("Συμπληρώστε πρώτα Πελάτες και Προϊόντα!"); return; }

            const clientName = clientFull.split(' (')[0];
            const clientCity = clientFull.split(' (')[1].replace(')', '');
            const formattedDate = new Date().toLocaleDateString('el-GR');

            orders.push({
                id: "ORD-" + Math.floor(1000 + Math.random() * 9000),
                date: formattedDate, 
                client: clientName, 
                city: clientCity,
                product: prodVal, 
                qty: parseInt(document.getElementById('orderQty').value), 
                status: "Σε αναμονή"
            });
            localStorage.setItem('econment_orders', JSON.stringify(orders));
            renderOrders();
            toggleModal(false);
        }

        // Η ΝΕΑ ΛΟΓΙΚΗ ΓΙΑ ΤΗΝ ΑΛΛΑΓΗ ΚΑΤΑΣΤΑΣΗΣ ΚΑΙ ΕΝΗΜΕΡΩΣΗ ΑΠΟΘΗΚΗΣ
        function updateStatus(index, newStatus) {
            let products = JSON.parse(localStorage.getItem('econment_products') || '[]');
            const order = orders[index];
            const oldStatus = order.status;

            // Αν αλλάξει σε "Παραδόθηκε" (και δεν ήταν ήδη), αφαιρούμε από το στοκ
            if (newStatus === "Παραδόθηκε" && oldStatus !== "Παραδόθηκε") {
                let prodIndex = products.findIndex(p => p.name === order.product);
                if (prodIndex !== -1) {
                    if (products[prodIndex].qty < order.qty) {
                        alert(`⚠️ Ανεπαρκές απόθεμα στην αποθήκη! Διαθέσιμα: ${products[prodIndex].qty}`);
                        renderOrders(); // Επαναφέρει το dropdown στην προηγούμενη κατάσταση
                        return;
                    }
                    products[prodIndex].qty -= order.qty;
                    localStorage.setItem('econment_products', JSON.stringify(products));
                }
            } 
            // Αν από "Παραδόθηκε" το γυρίσεις πίσω σε κάτι άλλο, επιστρέφουμε τα προϊόντα στο στοκ
            else if (oldStatus === "Παραδόθηκε" && newStatus !== "Παραδόθηκε") {
                let prodIndex = products.findIndex(p => p.name === order.product);
                if (prodIndex !== -1) {
                    products[prodIndex].qty += order.qty;
                    localStorage.setItem('econment_products', JSON.stringify(products));
                }
            }

            // Αποθήκευση της νέας κατάστασης
            orders[index].status = newStatus;
            localStorage.setItem('econment_orders', JSON.stringify(orders));
            renderOrders();
        }

        function deleteOrder(index) {
            if (confirm("Διαγραφή παραγγελίας;")) {
                // Αν διαγραφεί παραγγελία που είχε ήδη παραδοθεί, επιστρέφουμε το στοκ στην αποθήκη
                if (orders[index].status === "Παραδόθηκε") {
                    let products = JSON.parse(localStorage.getItem('econment_products') || '[]');
                    let prodIndex = products.findIndex(p => p.name === orders[index].product);
                    if (prodIndex !== -1) {
                        products[prodIndex].qty += orders[index].qty;
                        localStorage.setItem('econment_products', JSON.stringify(products));
                    }
                }
                orders.splice(index, 1);
                localStorage.setItem('econment_orders', JSON.stringify(orders));
                renderOrders();
            }
        }
        
        function renderOrders() {
            const tbody = document.getElementById('ordersBody'); tbody.innerHTML = '';
            orders.forEach((order, index) => {
                // Δυναμικό χρώμα ανάλογα με την κατάσταση
                let selectColor = "bg-yellow-100 text-yellow-800 border-yellow-300";
                if(order.status === "Παραδόθηκε") selectColor = "bg-green-100 text-green-800 border-green-300";
                if(order.status === "Ακυρώθηκε") selectColor = "bg-red-100 text-red-800 border-red-300";

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm font-mono"><strong>${order.id}</strong><br><span class="text-xs text-gray-400">${order.date}</span></td>
                        <td class="px-6 py-4 text-sm"><strong>${order.client}</strong><br><span class="text-xs text-gray-500">📍 ${order.city}</span></td>
                        <td class="px-6 py-4 text-sm font-medium text-gray-900">${order.product} <span class="text-indigo-600 font-bold">(x${order.qty})</span></td>
                        <td class="px-6 py-4 text-sm">
                            <select onchange="updateStatus(${index}, this.value)" class="text-xs font-bold rounded p-1 border ${selectColor} bg-white cursor-pointer focus:outline-none">
                                <option value="Σε αναμονή" ${order.status === 'Σε αναμονή' ? 'selected' : ''}>⏳ Σε αναμονή</option>
                                <option value="Παραδόθηκε" ${order.status === 'Παραδόθηκε' ? 'selected' : ''}>✅ Παραδόθηκε</option>
                                <option value="Ακυρώθηκε" ${order.status === 'Ακυρώθηκε' ? 'selected' : ''}>❌ Ακυρώθηκε</option>
                            </select>
                        </td>
                        <td class="px-6 py-4 text-right text-sm">
                            <button onclick="deleteOrder(${index})" class="text-red-600 bg-red-50 px-2 py-1 rounded">🗑️</button>
                        </td>
                    </tr>`;
            });
        }
        window.onload = loadOrders;
    </script>
</body>
</html>
