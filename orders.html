<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econment - Αποθήκη</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="container mx-auto p-4 md:p-6">
        
        <!-- Header & Navigation -->
        <div class="mb-6 bg-white p-6 rounded-lg shadow-sm flex flex-col lg:flex-row justify-between items-center gap-4 border border-gray-200">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Econment - Κεντρική Αποθήκη</h1>
                <p class="text-sm text-gray-500 mt-1">Έλεγχος Αποθεμάτων, Ορίων Ασφαλείας & Ψυκτικών Θαλάμων</p>
                <nav class="flex flex-wrap gap-2 md:gap-4 mt-4">
                    <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600 transition font-medium">👥 Πελατολόγιο</a>
                    <a href="inventory.html" class="text-sm text-blue-600 border-b-2 border-blue-600 pb-1 font-bold">📦 Αποθήκη (Στοκ)</a>
                    <a href="orders.html" class="text-sm text-gray-500 hover:text-blue-600 transition font-medium">🚚 Διανομές / Παραγγελίες</a>
                </nav>
            </div>
            <div>
                <button onclick="toggleModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow text-sm font-bold transition">
                    + Νέο Προϊόν
                </button>
            </div>
        </div>

        <!-- Αναζήτηση και Φίλτρα -->
        <div class="mb-4 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/3">
                <input type="text" id="searchInput" onkeyup="filterInventory()" placeholder="Αναζήτηση με Κωδικό ή Όνομα..." 
                       class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-sm">
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="filterType('ALL')" id="btnAll" class="bg-gray-800 text-white text-xs px-3 py-1.5 rounded-full font-medium shadow-sm">Όλα</button>
                <button onclick="filterType('FREEZER')" id="btnFreezer" class="bg-white text-gray-600 text-xs px-3 py-1.5 rounded-full font-medium border border-gray-200 shadow-sm">Μόνο Κατάψυξη ❄️</button>
                <button onclick="filterType('ALERT')" id="btnAlert" class="bg-white text-gray-600 text-xs px-3 py-1.5 rounded-full font-medium border border-gray-200 shadow-sm">Σε Έλλειψη ⚠️</button>
            </div>
        </div>

        <!-- Πίνακας Αποθήκης -->
        <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th onclick="sortInventory(0)" class="cursor-pointer px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider hover:bg-gray-100">Κωδικός <span id="sortIcon0">↕</span></th>
                            <th onclick="sortInventory(1)" class="cursor-pointer px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider hover:bg-gray-100">Περιγραφή / Προϊόν <span id="sortIcon1">↕</span></th>
                            <th onclick="sortInventory(2)" class="cursor-pointer px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider hover:bg-gray-100">Κατάψυξη ❄️ <span id="sortIcon2">↕</span></th>
                            <th onclick="sortInventory(3)" class="cursor-pointer px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider hover:bg-gray-100">Διαθέσιμο Απόθεμα <span id="sortIcon3">↕</span></th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Γρήγορη Μεταβολή</th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Όριο Ασφαλείας</th>
                            <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Ενέργειες</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="inventoryBody">
                        <!-- Φορτώνεται δυναμικά -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL ΦΟΡΜΑΣ ΠΡΟΪΟΝΤΟΣ -->
    <div id="productModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full overflow-hidden border border-gray-200">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">Εισαγωγή Νέου Προϊόντος</h3>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Κωδικός (SKU) *</label>
                    <input type="text" id="prodSku" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm font-mono focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Όνομα / Περιγραφή *</label>
                    <input type="text" id="prodName" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-center p-2.5 bg-blue-50 rounded-lg">
                    <input type="checkbox" id="prodFreezer" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="prodFreezer" class="ml-2 text-sm font-semibold text-gray-700 select-none">Απαιτεί Κατάψυξη / Ψυγείο; ❄️</label>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Απόθεμα *</label>
                        <input type="number" id="prodQty" required min="0" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Όριο Ασφαλείας *</label>
                        <input type="number" id="prodMin" required min="0" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="pt-4 border-t flex justify-end space-x-2">
                    <button type="button" onclick="toggleModal(false)" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm">Ακύρωση</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow">Αποθήκευση</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { sku: "PRD-001", name: "Ψηφιακός Ελεγκτής Πάνελ", freezer: false, qty: 45, minQty: 10 },
            { sku: "FRZ-102", name: "Ειδικό Ψυκτικό Υγρό R410A", freezer: true, qty: 3, minQty: 5 },
            { sku: "PRD-003", name: "Καλώδιο Solar 6mm (Μέτρα)", freezer: false, qty: 250, minQty: 50 }
        ];

        let products = [];
        let currentFilter = 'ALL'; 
        let sortDirections = { 0: false, 1: false, 2: false, 3: false };

        function loadInventory() {
            const stored = localStorage.getItem('econment_products');
            if (stored) { products = JSON.parse(stored); } 
            else { products = defaultProducts; localStorage.setItem('econment_products', JSON.stringify(products)); }
            applyFiltersAndRender();
        }

        function toggleModal(show) {
            const modal = document.getElementById('productModal');
            if (show) modal.classList.remove('hidden');
            else { modal.classList.add('hidden'); document.getElementById('productForm').reset(); }
        }

        function saveProduct(event) {
            event.preventDefault();
            const newProduct = {
                sku: document.getElementById('prodSku').value.toUpperCase(),
                name: document.getElementById('prodName').value,
                freezer: document.getElementById('prodFreezer').checked,
                qty: parseInt(document.getElementById('prodQty').value),
                minQty: parseInt(document.getElementById('prodMin').value)
            };
            products.push(newProduct);
            localStorage.setItem('econment_products', JSON.stringify(products));
            applyFiltersAndRender();
            toggleModal(false);
        }

        // ➕ / ➖ ΓΡΗΓΟΡΗ ΜΕΤΑΒΟΛΗ ΑΠΟΘΕΜΑΤΟΣ ΜΕ ΕΝΑ ΚΛΙΚ
        function adjustStock(index, direction) {
            const inputEl = document.getElementById(`adjustAmt-${index}`);
            const amount = parseInt(inputEl.value);
            
            if (isNaN(amount) || amount <= 0) {
                alert("Παρακαλώ εισάγετε μια έγκυρη θετική ποσότητα.");
                return;
            }

            if (direction === -1 && products[index].qty < amount) {
                alert(`Δεν μπορείτε να αφαιρέσετε ${amount} τεμάχια. Το τρέχον απόθεμα είναι ${products[index].qty}.`);
                return;
            }

            // Εφαρμογή μεταβολής
            products[index].qty += (direction * amount);
            localStorage.setItem('econment_products', JSON.stringify(products));
            
            // Επαναφορά του input στο 1
            inputEl.value = 1;
            
            applyFiltersAndRender();
        }

        function deleteProduct(index) {
            const prodName = products[index].name;
            if (confirm(`Είστε σίγουρος ότι θέλετε να διαγράψετε το προϊόν "${prodName}" από το Στοκ;`)) {
                products.splice(index, 1);
                localStorage.setItem('econment_products', JSON.stringify(products));
                applyFiltersAndRender();
            }
        }

        function renderInventory(data) {
            const tbody = document.getElementById('inventoryBody');
            tbody.innerHTML = '';
            data.forEach((prod) => {
                const actualIndex = products.indexOf(prod);
                const isLowStock = prod.qty <= prod.minQty;
                const qtyClass = isLowStock ? 'text-red-600 font-bold bg-red-50 px-2.5 py-1 rounded border border-red-200' : 'text-gray-900 font-semibold';
                const rowStatusAlert = isLowStock ? '⚠️ Χαμηλό Στοκ' : '✓ Επαρκές';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-600">${prod.sku}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-bold text-gray-900">${prod.name}</div>
                            <div class="text-xs text-gray-400">Κατάσταση: ${rowStatusAlert}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            ${prod.freezer ? '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-cyan-100 text-cyan-800 border border-cyan-200">❄️ ΝΑΙ</span>' : '<span class="px-2.5 py-1 text-xs rounded-full bg-gray-100 text-gray-600">Όχι</span>'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm"><span class="${qtyClass}">${prod.qty}</span></td>
                        <!-- Στήλη Γρήγορης Μεταβολής -->
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <div class="flex items-center space-x-1">
                                <button onclick="adjustStock(${actualIndex}, -1)" class="bg-red-500 hover:bg-red-600 text-white font-extrabold px-2.5 py-1 rounded transition text-sm">-</button>
                                <input type="number" id="adjustAmt-${actualIndex}" value="1" min="1" class="w-14 text-center border border-gray-300 rounded py-1 text-xs focus:ring-1 focus:ring-blue-500 outline-none font-bold">
                                <button onclick="adjustStock(${actualIndex}, 1)" class="bg-green-500 hover:bg-green-600 text-white font-extrabold px-2.5 py-1 rounded transition text-sm">+</button>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-medium">${prod.minQty}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm">
                            <button onclick="deleteProduct(${actualIndex})" class="text-red-600 hover:text-red-900 font-bold bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded transition">
                                🗑️ Διαγραφή
                            </button>
                        </td>
                    </tr>`;
            });
        }

        function sortInventory(columnIndex) {
            const isDescending = sortDirections[columnIndex];
            sortDirections[columnIndex] = !isDescending;

            [0, 1, 2, 3].forEach(idx => {
                const icon = document.getElementById(`sortIcon${idx}`);
                if (icon) {
                    icon.innerText = '↕';
                    icon.className = 'ml-1 text-gray-400';
                }
            });

            const currentIcon = document.getElementById(`sortIcon${columnIndex}`);
            if (currentIcon) {
                currentIcon.innerText = isDescending ? '▼' : '▲';
                currentIcon.className = 'ml-1 text-blue-600 font-bold';
            }

            products.sort((a, b) => {
                if (columnIndex === 3) return isDescending ? b.qty - a.qty : a.qty - b.qty;
                let valA = columnIndex === 0 ? a.sku : columnIndex === 1 ? a.name : a.freezer ? "1" : "0";
                let valB = columnIndex === 0 ? b.sku : columnIndex === 1 ? b.name : b.freezer ? "1" : "0";
                return isDescending ? valB.localeCompare(valA, 'el') : valA.localeCompare(valB, 'el');
            });
            applyFiltersAndRender();
        }

        function filterType(type) {
            currentFilter = type;
            const buttons = {
                'ALL': document.getElementById('btnAll'),
                'FREEZER': document.getElementById('btnFreezer'),
                'ALERT': document.getElementById('btnAlert')
            };
            
            Object.values(buttons).forEach(btn => {
                btn.className = "bg-white text-gray-600 hover:bg-gray-50 text-xs px-3 py-1.5 rounded-full font-medium border border-gray-200 shadow-sm";
            });

            if (type === 'ALL') buttons['ALL'].className = "bg-gray-800 text-white text-xs px-3 py-1.5 rounded-full font-medium shadow-sm";
            if (type === 'FREEZER') buttons['FREEZER'].className = "bg-cyan-600 text-white text-xs px-3 py-1.5 rounded-full font-medium shadow-sm";
            if (type === 'ALERT') buttons['ALERT'].className = "bg-red-600 text-white text-xs px-3 py-1.5 rounded-full font-medium shadow-sm";

            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            let filtered = products;
            if (currentFilter === 'FREEZER') filtered = filtered.filter(p => p.freezer === true);
            else if (currentFilter === 'ALERT') filtered = filtered.filter(p => p.qty <= p.minQty);
            filtered = filtered.filter(p => p.sku.toLowerCase().includes(searchVal) || p.name.toLowerCase().includes(searchVal));
            renderInventory(filtered);
        }

        function filterInventory() { applyFiltersAndRender(); }
        window.onload = loadInventory;
    </script>
</body>
</html>
