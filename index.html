<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econment - Πελατολόγιο</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto p-6">
        <div class="mb-6 bg-white p-6 rounded-lg shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Econment - Εσωτερικό Σύστημα</h1>
                <p class="text-sm text-gray-500">Διαχείριση Αποθεμάτων & Κατάλογος Πελατών</p>
                <nav class="flex space-x-4 mt-3">
                    <a href="index.html" class="text-sm text-blue-600 border-b-2 border-blue-600 pb-1 font-bold">👥 Πελατολόγιο</a>
                    <a href="inventory.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium">📦 Αποθήκη (Στοκ)</a>
                    <a href="orders.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium">🚚 Διανομές / Παραγγελίες</a>
                </nav>
            </div>
            <div class="flex flex-wrap gap-2 justify-end">
                <button onclick="exportBackup()" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-2 rounded text-xs font-medium">💾 Εξαγωγή Backup</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-2 rounded text-xs font-medium">📂 Εισαγωγή Backup</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importBackup(event)">
                <button onclick="toggleModal(true)" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow text-sm font-medium">+ Προσθήκη Πελάτη</button>
            </div>
        </div>

        <div class="mb-4 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/3">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Αναζήτηση..." class="w-full px-4 py-2 rounded-lg border bg-white text-sm">
            </div>
            <div class="text-sm text-gray-600">Σύνολο: <span id="clientCount" class="font-bold text-blue-600">0</span> πελάτες</div>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Επωνυμία</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ΑΦΜ</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Τύπος</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Πόλη</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ενέργειες</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="customerModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6">
            <form id="clientForm" onsubmit="saveClient(event)" class="space-y-4">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Καρτέλα Νέου Πελάτη</h3>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Επωνυμία Επιχείρησης *</label>
                    <input type="text" id="formCompanyName" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">ΑΦΜ *</label>
                        <input type="text" id="formVat" required pattern="[0-9]{9}" class="w-full px-3 py-2 border rounded-lg text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Πόλη *</label>
                        <input type="text" id="formCity" required class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                </div>
                <div class="pt-4 border-t flex justify-end space-x-2">
                    <button type="button" onclick="toggleModal(false)" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm">Ακύρωση</button>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm shadow">Αποθήκευση</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let clients = [];
        function loadClients() {
            clients = JSON.parse(localStorage.getItem('econment_clients') || '[]');
            renderTable(clients);
        }
        function toggleModal(show) {
            document.getElementById('customerModal').classList.toggle('hidden', !show);
            if(!show) document.getElementById('clientForm').reset();
        }
        function saveClient(event) {
            event.preventDefault();
            clients.push({
                companyName: document.getElementById('formCompanyName').value,
                vat: document.getElementById('formVat').value,
                type: "Τεχνικό Γραφείο",
                city: document.getElementById('formCity').value,
                owner: "—", address: "—", phone: "—"
            });
            localStorage.setItem('econment_clients', JSON.stringify(clients));
            renderTable(clients);
            toggleModal(false);
        }
        function deleteClient(index) {
            if (confirm("Διαγραφή πελάτη;")) {
                clients.splice(index, 1);
                localStorage.setItem('econment_clients', JSON.stringify(clients));
                renderTable(clients);
            }
        }
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach((client, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">${client.companyName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono">${client.vat}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${client.type}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-800">${client.city}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm">
                            <button onclick="deleteClient(${index})" class="text-red-600 bg-red-50 px-2 py-1 rounded">🗑️</button>
                        </td>
                    </tr>`;
            });
            document.getElementById('clientCount').innerText = data.length;
        }
        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                clients: JSON.parse(localStorage.getItem('econment_clients') || '[]'),
                products: JSON.parse(localStorage.getItem('econment_products') || '[]'),
                orders: JSON.parse(localStorage.getItem('econment_orders') || '[]')
            }));
            const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "econment_backup.json"); dl.click();
        }
        function importBackup(event) {
            const file = event.target.files[0]; if (!file) return;
            const r = new FileReader(); r.onload = function(e) {
                const imported = JSON.parse(e.target.result);
                if (imported.clients) localStorage.setItem('econment_clients', JSON.stringify(imported.clients));
                if (imported.products) localStorage.setItem('econment_products', JSON.stringify(imported.products));
                if (imported.orders) localStorage.setItem('econment_orders', JSON.stringify(imported.orders));
                location.reload();
            }; r.readAsText(file);
        }
        window.onload = loadClients;
    </script>
</body>
</html>
