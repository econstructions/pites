<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΕΠΩΝΥΜΙΑ ΕΠΙΧΕΙΡΗΣΗΣ - Είσοδος</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        .font-extrabold-custom {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Διακοσμητικό Φόντο -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>

    <div class="z-10 flex flex-col items-center text-center p-6">
        
        <!-- Οβάλ Logo -->
        <div class="w-40 h-28 md:w-56 md:h-36 bg-white rounded-[50%] shadow-xl border-4 border-gray-800 flex items-center justify-center overflow-hidden mb-8">
            <!-- Αντικαταστήστε το src με το πραγματικό logo, π.χ. 'images/logo.png' -->
            <img src="images/logo.png" alt="Company Logo" class="w-full h-full object-cover" 
                 onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%234B5563\' stroke-width=\'1.5\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' d=\'M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008z\'/></svg>'">
        </div>

        <!-- Επωνυμία (Σοβαρή, Extra Bold) -->
        <h1 class="font-extrabold-custom text-4xl md:text-6xl text-gray-900 tracking-tighter mb-2 uppercase drop-shadow-sm">
            ΕΠΩΝΥΜΙΑ ΕΠΙΧΕΙΡΗΣΗΣ
        </h1>
        <p class="text-gray-500 font-medium tracking-wide mb-12">Σύστημα Διαχείρισης ERP</p>

        <!-- Κουμπί Πληκτρολογίου (Enter) -->
        <a href="customers.html" 
           class="bg-gray-100 border border-gray-300 border-b-[6px] border-b-gray-400 rounded-xl px-12 py-4 font-bold text-gray-700 text-xl md:text-2xl active:border-b-0 active:translate-y-[6px] transition-all flex items-center gap-3 uppercase tracking-widest shadow-sm hover:bg-gray-50 select-none">
            ENTER <span class="text-2xl font-normal">↵</span>
        </a>

    </div>

</body>
</html>
